<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід</title>
  <script src="main.js" defer></script>
  <style>
  body {
            font-family: Arial, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }
        .button-container {
            position: relative;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .tooltip {
            position: absolute;
            background-color: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip.top {
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 5px;
        }
        .tooltip.bottom {
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 5px;
        }
        .button-container:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
  </style>
</head>
<body>
   <div class="button-container">
        <button>Кнопка 1</button>
        <div class="tooltip top">Підказка зверху</div>
    </div>
    <div class="button-container" style="margin-top: 150px;">
        <button>Кнопка 2</button>
        <div class="tooltip bottom">Підказка знизу</div>
    </div>
</body>
</html>
