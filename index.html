<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід</title>
  <script src="main.js" defer></script>
  <style>
   body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .traffic-light {
            width: 100px;
            background-color: #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .light {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 10px auto;
            opacity: 0.3;
        }
        .red {
            background-color: red;
        }
        .yellow {
            background-color: yellow;
        }
        .green {
            background-color: green;
        }
        .active {
            opacity: 1;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
  <div class="traffic-light">
        <div class="light red active" id="red"></div>
        <div class="light yellow" id="yellow"></div>
        <div class="light green" id="green"></div>
    </div>
    <button id="switchBtn">Переключити</button>
</body>
</html>
