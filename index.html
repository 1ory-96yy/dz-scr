<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід</title>
  <script src="main.js" defer></script>
  <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #field {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: green;
            cursor: pointer;
        }
        #ball {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: white;
            border-radius: 50%;
            top: 0;
            left: 0;
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>
   <div id="field">
        <div id="ball"></div>
    </div>
</body>
</html>
